<header class="site-header">
  <a
    class="brand"
    [routerLink]="['/']"
    fragment="inicio"
    aria-label="Mixtlis en la Montaña, inicio"
    (click)="closeMenu()"
  >
    <img src="assets/images/logo.webp" alt="Mixtlis en la Montaña" />
  </a>

  <button
    class="menu-toggle"
    type="button"
    [attr.aria-label]="menuOpen ? 'Cerrar menú' : 'Abrir menú'"
    [attr.aria-expanded]="menuOpen"
    (click)="toggleMenu()"
  >
    <span></span><span></span><span></span>
  </button>

  <nav class="main-nav" [class.is-open]="menuOpen" aria-label="Navegación principal">
    @for (item of navigationItems; track item.id) {
      <a
        [routerLink]="item.href.startsWith('#') ? '/' : item.href"
        [fragment]="item.href.startsWith('#') ? item.href.slice(1) : undefined"
        (click)="closeMenu()"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <a class="cart-link" [routerLink]="['/']" fragment="tienda" aria-label="Carrito con 0 artículos">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M4 11h24l-2 17H6L4 11Z"></path>
      <path d="M11 12V8a5 5 0 0 1 10 0v4M10 17v5m6-5v5m6-5v5"></path>
    </svg>
    <span>0</span>
  </a>
</header>

<router-outlet></router-outlet>

<footer class="site-footer">
  <a class="footer-brand" [routerLink]="['/']" fragment="inicio">
    MIXTLIS <span>EN LA MONTAÑA</span>
  </a>
  <p>© 2026 Mixtlis en la Montaña. Todos los derechos reservados.</p>
  <a [routerLink]="['/']" fragment="inicio" class="back-to-top">VOLVER ARRIBA ↑</a>
</footer>
